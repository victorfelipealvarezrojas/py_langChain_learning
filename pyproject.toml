[project]
name = "document-ai"
version = "0.1.0"
description = "esto es un visor de documentos"
authors = [
    {name = "victorfelipealvarezrojas",email = "victorfelipealvarezrojas@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pymongo[srv] (>=4.19.0,<5.0.0)",
    "fastapi[standard] (>=0.148.0,<0.149.0)",
    "requests (>=2.34.2,<3.0.0)",
    "langchain (>=1.4.6,<2.0.0)",
    "openai (>=3.35.1,<4.0.0)",
    "langchain-openai (>=1.7.2,<2.0.0)",
    "mypy (>=2.4.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
